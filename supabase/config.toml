# Peacock Studio Supabase config (functions only; local stack optional)

[functions.send-org-invite]
# Clerk third-party JWTs fail the legacy gateway verify_jwt check.
# Auth is enforced inside the function via claim_org_invite_email_send + Turnstile.
verify_jwt = false

[functions.resolve-share]
# Public share viewers may be anonymous; Turnstile + rate limits are enforced inside.
verify_jwt = false

[functions.platform-admin]
# Clerk third-party JWTs fail the legacy gateway verify_jwt check.
# Auth is enforced inside via resolve_actor_email + SUPER_ADMIN_EMAILS secret.
verify_jwt = false
