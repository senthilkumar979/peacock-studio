  # --- Storage ---
  /storage/v1/object/screenshots/{path}:
    post:
      tags: [Storage]
      operationId: uploadScreenshotObject
      summary: Upload screenshot object
      description: |
        Bucket `screenshots`. Client: `screenshotStorage.ts` via
        `supabase.storage.from('screenshots').upload(...)`.
      x-peacock-client: screenshotStorage
      parameters:
        - $ref: '#/components/parameters/ApikeyHeader'
        - $ref: '#/components/parameters/RequiredBearer'
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Uploaded
    delete:
      tags: [Storage]
      operationId: removeScreenshotObject
      summary: Remove screenshot object(s)
      description: 'Client: screenshotStorage via storage.remove'
      x-peacock-client: screenshotStorage
      parameters:
        - $ref: '#/components/parameters/ApikeyHeader'
        - $ref: '#/components/parameters/RequiredBearer'
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removed

  /storage/v1/object/sign/screenshots/{path}:
    post:
      tags: [Storage]
      operationId: signScreenshotObject
      summary: Create signed URL for screenshot
      description: |
        Auth client and `resolve-share` screenshots action both create signed URLs
        (TTL from `SIGNED_URL_TTL_SECONDS`).
      x-peacock-client: screenshotStorage / resolve-share
      parameters:
        - $ref: '#/components/parameters/ApikeyHeader'
        - $ref: '#/components/parameters/OptionalBearer'
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Signed URL payload

  # --- External (informational paths — not Peacock-owned) ---
  /external/clerk:
    get:
      tags: [External]
      operationId: externalClerk
      summary: Clerk authentication (SDK)
      description: |
        `@clerk/react` SignIn/SignUp, `session.getToken()` for Supabase JWT.
        Not called via fetch from app code — SDK manages HTTP.
      externalDocs:
        url: https://clerk.com/docs
      responses:
        '200':
          description: Informational only — no Peacock endpoint

  /external/turnstile:
    get:
      tags: [External]
      operationId: externalTurnstile
      summary: Cloudflare Turnstile (client widget)
      description: |
        Client: `packages/app/src/security/turnstile.ts` (`VITE_TURNSTILE_SITE_KEY`).
        Siteverify runs only on Edge Functions.
      externalDocs:
        url: https://developers.cloudflare.com/turnstile/
      responses:
        '200':
          description: Informational only

  /external/posthog:
    get:
      tags: [External]
      operationId: externalPosthog
      summary: PostHog product analytics
      description: |
        `posthog-js` when `VITE_POSTHOG_KEY` is set. Default host `eu.i.posthog.com`.
      externalDocs:
        url: https://posthog.com/docs
      responses:
        '200':
          description: Informational only

  /external/sentry:
    get:
      tags: [External]
      operationId: externalSentry
      summary: Sentry error reporting
      description: |
        `@sentry/react` when `VITE_SENTRY_DSN` is set.
      externalDocs:
        url: https://docs.sentry.io/
      responses:
        '200':
          description: Informational only

  /external/freshchat:
    get:
      tags: [External]
      operationId: externalFreshchat
      summary: Freshchat support widget
      description: |
        Embed when `VITE_FRESHCHAT_SCRIPT_SRC` is set (Freshworks CDN script, e.g. eu.fw-cdn.com).
      externalDocs:
        url: https://developers.freshchat.com/web-sdk/
      responses:
        '200':
          description: Informational only

components:
  parameters:
    ApikeyHeader:
      name: apikey
      in: header
      required: true
      schema:
        type: string
      description: Supabase anon key (`VITE_SUPABASE_ANON_KEY`)
    RequiredBearer:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer Clerk JWT (Supabase third-party auth)
    OptionalBearer:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer Clerk JWT, or anon key for public share paths

  schemas:
    ErrorBody:
      type: object
      properties:
        error:
          type: string
    ResolveShareBody:
      type: object
      required: [token, turnstileToken]
      properties:
        action:
          type: string
          enum: [resolve, flow, tour, persona, screenshots]
          default: resolve
        token:
          type: string
        turnstileToken:
          type: string
        documentId:
          type: string
        personaId:
          type: string
    PlatformAdminBody:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [whoami, overview, listOrganizations, getOrganization]
        organizationId:
          type: string
          description: Required when action is getOrganization

  responses:
    ErrorJson:
      description: Error payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
