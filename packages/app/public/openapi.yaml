openapi: 3.1.0
info:
  title: Peacock App API Catalog
  version: 0.1.0
  description: |
    Hand-maintained catalog of HTTP/API surfaces the Peacock SPA uses.

    Peacock has **no first-party REST server**. Cloud traffic goes to Supabase
    (Edge Functions, PostgREST tables/RPCs, Storage) plus third-party SDKs
    (Clerk, Turnstile, PostHog, Sentry, Freshchat).

    Server base URL is your project `VITE_SUPABASE_URL`. Try-it-out is disabled
    in the UI — calls require Clerk JWTs and often Cloudflare Turnstile tokens.
  contact:
    name: Peacock
servers:
  - url: '{SUPABASE_URL}'
    description: Supabase project URL (VITE_SUPABASE_URL)
    variables:
      SUPABASE_URL:
        default: https://YOUR_PROJECT.supabase.co
tags:
  - name: Edge Functions
    description: First-party Supabase Edge Functions under `/functions/v1/*`
  - name: PostgREST RPCs
    description: Postgres functions invoked via `/rest/v1/rpc/{name}`
  - name: PostgREST Tables
    description: Table CRUD via `/rest/v1/{table}` (supabase-js `.from()`)
  - name: Storage
    description: Supabase Storage bucket `screenshots`
  - name: External
    description: Third-party integrations (informational only)

paths:
  /functions/v1/resolve-share:
    post:
      tags: [Edge Functions]
      operationId: resolveShare
      summary: Resolve public share (Turnstile + rate limit)
      description: |
        Public share gate. Deployed with `verify_jwt=false`.

        **Client:** `packages/app/src/cloud/publicShareClient.ts`

        **Actions** (`body.action`):
        - `resolve` (default) — share metadata via RPC `resolve_share_link`
        - `flow` — shared flow document (`documentId` required)
        - `tour` — shared product tour
        - `persona` — shared persona (`personaId` required)
        - `screenshots` — signed screenshot URL map (`documentId` required)

        Always requires `token` + `turnstileToken`. Optional `Authorization`
        Bearer (Clerk JWT) for auth-gated shares; otherwise anon key.
      parameters:
        - $ref: '#/components/parameters/ApikeyHeader'
        - $ref: '#/components/parameters/OptionalBearer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveShareBody'
            examples:
              resolve:
                value:
                  action: resolve
                  token: share-token
                  turnstileToken: turnstile-response
              flow:
                value:
                  action: flow
                  token: share-token
                  turnstileToken: turnstile-response
                  documentId: doc-uuid
      responses:
        '200':
          description: "Wrapped payload `{ data: ... }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    description: Action-specific payload
        '400':
          $ref: '#/components/responses/ErrorJson'
        '403':
          description: Bot check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          $ref: '#/components/responses/ErrorJson'
    options:
      tags: [Edge Functions]
      operationId: resolveShareCors
      summary: CORS preflight for resolve-share
      responses:
        '200':
          description: OK

  /functions/v1/send-org-invite:
    post:
      tags: [Edge Functions]
      operationId: sendOrgInvite
      summary: Send organization invite email (Resend)
      description: |
        Auth + ownership verified via RPC `claim_org_invite_email_send` with
        the caller's Bearer token. Requires Turnstile.

        **Client:** `organizationRepository.sendOrgInviteEmail`
      parameters:
        - $ref: '#/components/parameters/ApikeyHeader'
        - $ref: '#/components/parameters/RequiredBearer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationId, turnstileToken]
              properties:
                invitationId:
                  type: string
                inviterName:
                  type: string
                  default: A teammate
                turnstileToken:
                  type: string
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
        '400':
          $ref: '#/components/responses/ErrorJson'
        '401':
          $ref: '#/components/responses/ErrorJson'
        '403':
          description: Bot check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: Resend or claim failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  detail:
                    type: string
        '500':
          $ref: '#/components/responses/ErrorJson'
    options:
      tags: [Edge Functions]
      operationId: sendOrgInviteCors
      summary: CORS preflight for send-org-invite
      responses:
        '200':
          description: OK

  /functions/v1/platform-admin:
    post:
      tags: [Edge Functions]
      operationId: platformAdmin
      summary: Platform super-admin read-only stats
      description: |
        Auth via RPC `resolve_actor_email` — caller email must be in
        `SUPER_ADMIN_EMAILS` secret (except `whoami`).

        **Actions:** `whoami`, `overview`, `listOrganizations`, `getOrganization`

        **Client:** `platformAdminRepository.ts`
      parameters:
        - $ref: '#/components/parameters/ApikeyHeader'
        - $ref: '#/components/parameters/RequiredBearer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformAdminBody'
            examples:
              whoami:
                value: { action: whoami }
              overview:
                value: { action: overview }
              getOrganization:
                value:
                  action: getOrganization
                  organizationId: org-uuid
      responses:
        '200':
          description: "Action-specific JSON (whoami returns `{ isSuperAdmin }`)"
        '400':
          $ref: '#/components/responses/ErrorJson'
        '401':
          $ref: '#/components/responses/ErrorJson'
        '403':
          $ref: '#/components/responses/ErrorJson'
        '404':
          $ref: '#/components/responses/ErrorJson'
        '500':
          $ref: '#/components/responses/ErrorJson'
    options:
      tags: [Edge Functions]
      operationId: platformAdminCors
      summary: CORS preflight for platform-admin
      responses:
        '200':
          description: OK

